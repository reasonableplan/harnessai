max_concurrent: 2  # 동시 실행 에이전트 수 제한

# timeout_seconds 기준:
# - batch 모드 (full skeleton 생성): architect/designer 600s 권장
# - compact prompt (skeleton 이미 채워진 후): orchestrator 300s 충분
# 메인 레포 개발자 환경: 이 값들로 충분. CI/느린 환경: 1.5배 권장.

# ── 모델 티어 별칭 ──────────────────────────────────────────────
# 신모델 출시 시 아래 두 줄만 바꾸면 전체 에이전트에 반영된다.
# 각 에이전트는 `model_tier: judge|code` 로 참조하거나, `model:` 로 직접 지정(override) 가능.
models:
  judge: claude-opus-4-8   # 판단·설계·리뷰: architect · designer · orchestrator · reviewer · qa
  code: claude-sonnet-5    # 코드 생성: 모든 coder (backend · frontend · mobile 4종)

architect:
  provider: claude-cli
  model_tier: judge
  prompt_path: agents/architect/CLAUDE.md
  timeout_seconds: 600
  on_timeout: retry
  max_retries_on_timeout: 1
  max_tokens: 8192
  requires_capabilities: []
  requires_profile_ids: []

designer:
  provider: claude-cli
  model_tier: judge
  prompt_path: agents/designer/CLAUDE.md
  timeout_seconds: 600
  on_timeout: retry
  max_retries_on_timeout: 1
  max_tokens: 8192
  requires_capabilities: []
  requires_profile_ids: []

orchestrator:
  provider: claude-cli
  model_tier: judge
  prompt_path: agents/orchestrator/CLAUDE.md
  timeout_seconds: 300
  on_timeout: retry
  max_retries_on_timeout: 2
  max_tokens: 8192
  requires_capabilities: []
  requires_profile_ids: []

backend_coder:
  provider: claude-cli
  model_tier: code
  prompt_path: agents/backend_coder/CLAUDE.md
  timeout_seconds: 600
  on_timeout: retry
  max_retries_on_timeout: 1
  max_tokens: 16384
  requires_capabilities: [http_server, cli_entrypoint, sdk_surface]
  requires_profile_ids: []

frontend_coder:
