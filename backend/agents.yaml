  timeout_seconds: 600
  on_timeout: retry
  max_retries_on_timeout: 1
  max_tokens: 16384
  requires_capabilities: [ui]
  requires_profile_ids: []

# M0 first gate — React Native + Expo mobile coder (M1 에서 본 작업)
