name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check src/ tests/

      - name: Pyright type check
        working-directory: backend
        run: uv run pyright src/

      # Several tests exercise the installed runtime copies (~/.claude/harness,
      # ~/.claude/skills) and skill run.py scripts resolve profiles from
      # DEFAULT_HARNESS_DIR — install first to mirror a real user machine.
      - name: Install harness runtime to ~/.claude
        run: bash install.sh --force

      - name: Pytest
        working-directory: backend
        run: uv run pytest tests/ --rootdir=. -q

      - name: Harness schema validation
        working-directory: backend
        run: uv run python ../harness/bin/harness validate

      - name: Gate coverage benchmark
        working-directory: backend
        run: uv run python ../scripts/gate_benchmark.py

  install-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install harness CLI runtime dep (PyYAML)
        run: pip install pyyaml

      - name: Run install snapshot test
        run: bash tests/install/test_install_snapshot.sh
